name: CI

on:
  push:
    branches: [main, develop, 'hotfix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            variant: default
            fypp_args: ""
          - runner: ubuntu-latest
            variant: with_real128
            fypp_args: "-DWITH_REAL128"
          - runner: ubuntu-24.04-arm
            variant: default
            fypp_args: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install fpm (x86_64)
        if: matrix.runner != 'ubuntu-24.04-arm'
        uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache fpm binary (arm64)
        if: matrix.runner == 'ubuntu-24.04-arm'
        id: cache-fpm
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/fpm
          key: fpm-v0.13.0-${{ matrix.runner }}

      - name: Install fpm (arm64, build from source)
        if: matrix.runner == 'ubuntu-24.04-arm' && steps.cache-fpm.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.13.0 https://github.com/fortran-lang/fpm /tmp/fpm-src
          cd /tmp/fpm-src
          ./install.sh

      - name: Add fpm to PATH (arm64)
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python packages using pip
        run: pip install ford fypp numpy scipy

      - name: Generate source (${{ matrix.variant }})
        run: |
          fypp ${{ matrix.fypp_args }} -m math \
               src/legendre_polynomial_closed_form_fortran.fypp \
               src/legendre_polynomial_closed_form_fortran.f90
          for f in test/*.fypp; do
            fypp ${{ matrix.fypp_args }} -m math "$f" "${f%.fypp}.f90"
          done
          fypp ${{ matrix.fypp_args }} -m math \
               example/demo_p_n_fortran.fypp \
               example/demo_p_n.f90
          fypp ${{ matrix.fypp_args }} \
               example/demo_p_n_gnuplot.fypp \
               example/demo_p_n.gpl

      - name: Generate reference data (${{ matrix.variant }})
        run: |
          fypp ${{ matrix.fypp_args }} -m scipy.special \
               reference/scipy.fypp \
               reference/scipy.dat
          fypp ${{ matrix.fypp_args }} -F -m scipy.special \
               example/scipy_real.fypp \
               example/scipy_real.dat

      - name: Run tests (debug)
        run: fpm test --profile debug

      - name: Run tests (strict, 2008)
        run: |
          fpm clean --all
          fpm test --profile debug --flag "-Werror -std=f2008"

      - name: Run tests (strict, 2018)
        run: |
          fpm clean --all
          fpm test --profile debug --flag "-Werror -std=f2018"

      - name: Run tests (release)
        run: |
          fpm clean --all
          fpm test --profile release

      - name: Run examples (debug)
        run: fpm run --example --profile debug

      - name: Run examples (strict, 2008)
        run: |
          fpm clean --all
          fpm run --example --profile debug --flag "-Werror -std=f2008"

      - name: Run examples (strict, 2018)
        run: |
          fpm clean --all
          fpm run --example --profile debug --flag "-Werror -std=f2018"

      - name: Run examples (release)
        run: |
          fpm clean --all
          fpm run --example --profile release

      - name: Install & run gnuplot
        run: |
          sudo apt install -y gnuplot
          gnuplot --version
          gnuplot example/demo_p_n.gpl

      - name: Upload example outputs as artifact
        uses: actions/upload-artifact@v7
        with:
          name: example-outputs-${{ matrix.runner }}-${{ matrix.variant }}
          path: |
            example/*.svg
            example/*.dat

      - name: Install graphviz
        if: matrix.runner == 'ubuntu-latest' && matrix.variant == 'with_real128'
        run: |
          sudo apt install -y graphviz
          dot -V

      - name: Generate documentation
        if: matrix.runner == 'ubuntu-latest' && matrix.variant == 'with_real128'
        run: ford ford.md

      - name: Upload documentation files as artifact
        if: matrix.runner == 'ubuntu-latest' && matrix.variant == 'with_real128'
        id: upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc

  deploy-documentation:

    needs: test

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v5
